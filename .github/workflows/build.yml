name: Build Wall Be Back

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/wallbeback_ci
      SESSION_SECRET: ci-only-session-secret-do-not-use-in-production-1234567890
      UPLOAD_DIR: /tmp/wallbeback-media
      MAX_UPLOAD_BYTES: ${{ secrets.WALLBEBACK_MAX_UPLOAD_BYTES || '20971520' }}
      MAX_IMAGE_PIXELS: ${{ secrets.WALLBEBACK_MAX_IMAGE_PIXELS || '25000000' }}
      MAX_STORAGE_BYTES: ${{ secrets.WALLBEBACK_MAX_STORAGE_BYTES || '536870912' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Prepare standalone artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/.next
          cp -R .next/standalone/. artifact/
          cp -R .next/static artifact/.next/static
          if [ -d public ]; then cp -R public artifact/public; fi

      - name: Create Linux archive
        run: tar -C artifact -czf wallbeback-standalone.tar.gz .

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: wallbeback-standalone-tar
          path: wallbeback-standalone.tar.gz
          retention-days: 7

      - name: Deploy to Wall Be Back Alwaysdata site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.WALLBEBACK_DEPLOY_ENABLED == 'true'
        env:
          ALWAYSDATA_SSH_PRIVATE_KEY: ${{ secrets.WALLBEBACK_SSH_PRIVATE_KEY }}
          ALWAYSDATA_API_KEY: ${{ secrets.WALLBEBACK_ALWAYSDATA_API_KEY }}
          ALWAYSDATA_SITE_ID: ${{ secrets.WALLBEBACK_ALWAYSDATA_SITE_ID }}
          ALWAYSDATA_SSH_HOST: ${{ secrets.WALLBEBACK_ALWAYSDATA_SSH_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ALWAYSDATA_SSH_PRIVATE_KEY:?Missing Wall Be Back SSH key}"
          : "${ALWAYSDATA_API_KEY:?Missing Wall Be Back API key}"
          : "${ALWAYSDATA_SITE_ID:?Missing Wall Be Back site id}"
          : "${ALWAYSDATA_SSH_HOST:?Missing Wall Be Back SSH host}"

          key_file="$RUNNER_TEMP/wallbeback-deploy-key"
          known_hosts="$RUNNER_TEMP/wallbeback-known-hosts"
          printf '%s\n' "$ALWAYSDATA_SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keyscan -H "$ALWAYSDATA_SSH_HOST" > "$known_hosts"

          scp \
            -i "$key_file" \
            -o UserKnownHostsFile="$known_hosts" \
            -o StrictHostKeyChecking=yes \
            wallbeback-standalone.tar.gz \
            "chca@$ALWAYSDATA_SSH_HOST:/home/chca/"

          ssh \
            -i "$key_file" \
            -o UserKnownHostsFile="$known_hosts" \
            -o StrictHostKeyChecking=yes \
            "chca@$ALWAYSDATA_SSH_HOST" \
            'mkdir -p /home/chca/wallbeback-release && tar -xzf /home/chca/wallbeback-standalone.tar.gz --overwrite -C /home/chca/wallbeback-release'

          curl --fail --silent --show-error \
            --request POST \
            --user "$ALWAYSDATA_API_KEY account=chca:" \
            "https://api.alwaysdata.com/v1/site/$ALWAYSDATA_SITE_ID/restart/"
